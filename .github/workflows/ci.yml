# Checks every PR and push to main: unit tests on the pure core modules, the
# pinned web-common copy, and that every page's imports resolve.
# deploy.yml runs the same checks before each deploy.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - run: npm run verify
