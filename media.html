<!DOCTYPE html>
<html lang="en">
<head>

<title>Photos and videos | GullySport Hub Partner</title>
<link rel="icon" type="image/png" href="icons/brand-shield.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:ital,wght@1,800&display=swap" rel="stylesheet">

<body class="with-nav">
<header class="topbar">
  <a href="today.html" class="brand"><img src="icons/brand-shield.png" alt="" width="28" height="28"><span><b>Gully</b><i>Sport</i> <small>Hub Partner</small></span></a>
  <button class="link-btn" data-logout>Log out</button>
</header>
<main class="page">
<a href="facilities.html" class="back" id="back">‹ Facility</a>
<h1>Photos and videos</h1>
<p class="muted">Add 3 to 12 photos, up to 3 short clips (60 seconds, 50 MB) and up to 3 YouTube or Vimeo links. Drag to reorder; the cover photo is shown first.</p>
<div class="row-wrap">
  <label class="btn btn-primary">Add photos<input type="file" id="photos" accept="image/png,image/jpeg,image/webp" multiple hidden></label>
  <label class="btn btn-ghost">Add a clip<input type="file" id="clip" accept="video/mp4,video/quicktime" hidden></label>
  <form id="link-form" class="inline-form"><input id="link" type="url" placeholder="YouTube or Vimeo link"><button class="btn btn-ghost">Add link</button></form>
</div>
<p id="progress" class="muted" hidden></p>
<ul id="media" class="media-grid"></ul>
</main>
<script type="module" src="js/pages/media.js"></script>
</body>
</html>
